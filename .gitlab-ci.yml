
stages:
  - build
  - test
  - deploy

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

build:
  stage: build
  tags: [shell]
  script:
    - dotnet --version
    - dotnet build EOS.slnx -c Release --nologo

test:
  stage: test
  tags: [shell]
  needs: [build]
  script:
    - dotnet test EOS.slnx -c Release --nologo --logger "trx;LogFileName=results.trx" --results-directory TestResults
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - TestResults/
    reports:
      junit: TestResults/*.trx

deploy:
  stage: deploy
  tags: [shell]
  needs: [test]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - sh deploy/deploy.sh
  environment:
    name: production
