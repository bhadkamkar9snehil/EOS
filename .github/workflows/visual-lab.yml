name: EPA Visual Lab

on:
  pull_request:
    paths:
      - 'visual-lab/**'
      - 'src/EngineeringPerformance.UI/**'
      - '.github/workflows/visual-lab.yml'
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          set -e
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium not found on runner.' >&2
            exit 1
          fi
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
          "$CHROME" --version
      - name: Capture 1536x1024
        shell: bash
        run: |
          mkdir -p visual-lab/screenshots
          "${{ steps.chrome.outputs.path }}" \
            --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --allow-file-access-from-files \
            --window-size=1536,1024 \
            --screenshot="${{ github.workspace }}/visual-lab/screenshots/overview-realistic-1536x1024.png" \
            "file://${{ github.workspace }}/visual-lab/index.html"
      - name: Capture 1280x800
        shell: bash
        run: |
          "${{ steps.chrome.outputs.path }}" \
            --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --allow-file-access-from-files \
            --window-size=1280,800 \
            --screenshot="${{ github.workspace }}/visual-lab/screenshots/overview-realistic-1280x800.png" \
            "file://${{ github.workspace }}/visual-lab/index.html"
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: epa-visual-lab-screenshots
          path: visual-lab/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
