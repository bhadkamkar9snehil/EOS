name: Release

# Runs build/release.ps1 (test -> publish -> vpk pack) on a hosted Windows runner and attaches the
# resulting Velopack installer + delta packages to a GitHub Release. Triggered by pushing a tag
# like "v1.2.0". This is the piece that couldn't be verified from the Linux sandbox that otherwise
# did this project's work — see docs/installer.md.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # needed to create the GitHub Release and upload assets

jobs:
  release:
    name: Build, pack, and publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Velopack CLI (vpk)
        run: dotnet tool install -g vpk

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Run release script
        shell: pwsh
        run: ./build/release.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: EOS ${{ github.ref_name }}
          generate_release_notes: true
          files: build/Releases/*
