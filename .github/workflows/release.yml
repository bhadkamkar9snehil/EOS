name: Release

# Runs build/release.ps1 (test -> publish -> vpk pack) on a hosted Windows runner and attaches the
# resulting Velopack installer + delta packages to a GitHub Release. Triggered by pushing a tag
# like "v1.2.0". This is the piece that couldn't be verified from the Linux sandbox that otherwise
# did this project's work — see docs/installer.md.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # needed to create the GitHub Release and upload assets

jobs:
  release:
    name: Build, pack, and publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Velopack CLI (vpk)
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          [xml]$project = Get-Content "src/EngineeringPerformance.DesktopHost/EngineeringPerformance.DesktopHost.csproj"
          $projectVersion = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ($projectVersion -ne $version) {
            throw "Tag version $version does not match DesktopHost version $projectVersion."
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download previous Velopack release
        shell: pwsh
        run: vpk download github --repoUrl "https://github.com/${{ github.repository }}" --outputDir build/Releases --token "${{ secrets.GITHUB_TOKEN }}"

      - name: Run release script
        shell: pwsh
        run: ./build/release.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Publish Velopack release
        shell: pwsh
        run: >-
          vpk upload github
          --repoUrl "https://github.com/${{ github.repository }}"
          --outputDir build/Releases
          --token "${{ secrets.GITHUB_TOKEN }}"
          --publish
          --releaseName "EOS ${{ github.ref_name }}"
          --tag "${{ github.ref_name }}"
