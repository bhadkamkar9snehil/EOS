name: Validate EOS

on:
  push:
    branches: [ main, agent/theme-readability-refactor ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          node --check src/EngineeringPerformance.UI/wwwroot/theme.js
          node --check src/EngineeringPerformance.UI/wwwroot/theme-audit.js
          node --check src/EngineeringPerformance.UI/wwwroot/charts.js
          node --check src/EngineeringPerformance.UI/wwwroot/analytics-charts.js

      - name: Restore
        run: dotnet restore EngineeringPerformance.slnx

      - name: Build
        run: dotnet build EngineeringPerformance.slnx -c Release --no-restore

      - name: Test
        run: dotnet test EngineeringPerformance.slnx -c Release --no-build
