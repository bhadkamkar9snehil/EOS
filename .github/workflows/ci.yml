name: CI (manual fallback)

# Azure Pipelines (azure-pipelines.yml) is the authoritative push/PR CI path.
# Keep this workflow as an on-demand cross-platform fallback only; running two
# automatic CI systems creates duplicate work and conflicting status noise.

on:
  workflow_dispatch:

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # DesktopHost (WPF) targets net10.0-windows and can't build on Linux; every other project can.
      - name: Build Domain / Application / Infrastructure / UI
        run: |
          dotnet build src/EngineeringPerformance.Domain/EngineeringPerformance.Domain.csproj --configuration Release --no-restore
          dotnet build src/EngineeringPerformance.Application/EngineeringPerformance.Application.csproj --configuration Release --no-restore
          dotnet build src/EngineeringPerformance.Infrastructure/EngineeringPerformance.Infrastructure.csproj --configuration Release --no-restore
          dotnet build src/EngineeringPerformance.UI/EngineeringPerformance.UI.csproj --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test tests/EngineeringPerformance.Domain.Tests/EngineeringPerformance.Domain.Tests.csproj --configuration Release --no-restore
          dotnet test tests/EngineeringPerformance.Infrastructure.Tests/EngineeringPerformance.Infrastructure.Tests.csproj --configuration Release --no-restore
          dotnet test tests/EngineeringPerformance.UI.Tests/EngineeringPerformance.UI.Tests.csproj --configuration Release --no-restore

  windows-build:
    name: Windows build (DesktopHost)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build DesktopHost
        run: dotnet build src/EngineeringPerformance.DesktopHost/EngineeringPerformance.DesktopHost.csproj --configuration Release --no-restore
