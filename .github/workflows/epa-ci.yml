name: EPA CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        id: dotnet
        continue-on-error: true
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        id: node
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare diagnostics
        shell: powershell
        run: New-Item -ItemType Directory -Force ci-diagnostics | Out-Null

      - name: Validate launcher PowerShell
        id: ps
        continue-on-error: true
        shell: powershell
        run: |
          $failed = $false
          $messages = @()
          foreach ($file in @(
            'tools/EPA-Launcher/EPA-Launcher.ps1',
            'tools/EPA-Launcher/EPA-Launcher.Worker.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              foreach ($errorItem in $errors) {
                $messages += "$file : $($errorItem.Message) at $($errorItem.Extent.Text)"
              }
              $failed = $true
            } else {
              $messages += "$file : syntax OK"
            }
          }
          $messages | Set-Content ci-diagnostics/powershell.txt
          $messages | Write-Output
          if ($failed) { exit 1 }

      - name: Validate JavaScript
        id: js
        continue-on-error: true
        shell: powershell
        run: |
          $files = @(
            'src/EngineeringPerformance.UI/wwwroot/theme.js',
            'src/EngineeringPerformance.UI/wwwroot/skin.js',
            'src/EngineeringPerformance.UI/wwwroot/atlas-charts.js',
            'src/EngineeringPerformance.UI/wwwroot/realist-runtime.js'
          )
          $failed = $false
          $messages = @()
          foreach ($file in $files) {
            $output = & node --check $file 2>&1
            if ($LASTEXITCODE -ne 0) {
              $messages += "$file : FAILED"
              $messages += $output
              $failed = $true
            } else {
              $messages += "$file : syntax OK"
            }
          }
          $messages | Set-Content ci-diagnostics/javascript.txt
          $messages | Write-Output
          if ($failed) { exit 1 }

      - name: Restore
        id: restore
        continue-on-error: true
        shell: powershell
        run: |
          dotnet restore EngineeringPerformance.slnx 2>&1 | Tee-Object ci-diagnostics/restore.txt
          exit $LASTEXITCODE

      - name: Build Release
        id: build
        continue-on-error: true
        shell: powershell
        run: |
          dotnet build EngineeringPerformance.slnx -c Release --no-restore 2>&1 | Tee-Object ci-diagnostics/build.txt
          exit $LASTEXITCODE

      - name: Test Release
        id: test
        continue-on-error: true
        shell: powershell
        run: |
          dotnet test EngineeringPerformance.slnx -c Release --no-build 2>&1 | Tee-Object ci-diagnostics/test.txt
          exit $LASTEXITCODE

      - name: Record outcomes
        if: always()
        shell: powershell
        run: |
          @(
            'setup-dotnet=${{ steps.dotnet.outcome }}',
            'setup-node=${{ steps.node.outcome }}',
            'powershell=${{ steps.ps.outcome }}',
            'javascript=${{ steps.js.outcome }}',
            'restore=${{ steps.restore.outcome }}',
            'build=${{ steps.build.outcome }}',
            'test=${{ steps.test.outcome }}'
          ) | Set-Content ci-diagnostics/outcomes.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epa-ci-diagnostics
          path: ci-diagnostics
          if-no-files-found: warn

      - name: Enforce validation gate
        if: always()
        shell: powershell
        run: |
          $outcomes = @(
            '${{ steps.dotnet.outcome }}',
            '${{ steps.node.outcome }}',
            '${{ steps.ps.outcome }}',
            '${{ steps.js.outcome }}',
            '${{ steps.restore.outcome }}',
            '${{ steps.build.outcome }}',
            '${{ steps.test.outcome }}'
          )
          if ($outcomes -contains 'failure') { exit 1 }
