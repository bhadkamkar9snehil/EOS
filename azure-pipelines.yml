trigger:
  batch: true
  branches:
    include:
      - '*'

pr:
  autoCancel: true
  branches:
    include:
      - '*'

variables:
  buildConfiguration: Release
  visualEvidenceDirectory: '$(Agent.TempDirectory)\VisualEvidence'
  diagnosticsDirectory: '$(Agent.TempDirectory)\EosDiagnostics'

jobs:
  - job: windows_ci
    displayName: Windows build, test & visual validation
    timeoutInMinutes: 40
    workspace:
      clean: all
    pool:
      name: Default
      demands:
        - Agent.Name -equals EOS

    steps:
      - checkout: self
        clean: true
        fetchDepth: 0
        persistCredentials: false

      - powershell: ./scripts/validate-powershell.ps1
        displayName: Validate PowerShell automation

      # Project/dashboard/pipeline reconciliation mutates Azure DevOps configuration. Keep that
      # mutation on canonical main builds only; feature branches should only build and test code.
      - powershell: ./scripts/bootstrap-azure-devops-project.ps1
        displayName: Reconcile Azure DevOps project configuration
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        continueOnError: true
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      - powershell: ./scripts/ensure-shared-windows-pipelines.ps1
        displayName: Reconcile shared Windows build pipelines
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        continueOnError: true
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      - powershell: ./build/vm-health.ps1
        displayName: VM / agent preflight

      - task: UseDotNet@2
        displayName: Use .NET SDK from global.json
        inputs:
          packageType: sdk
          useGlobalJson: true
          workingDirectory: $(Build.SourcesDirectory)

      - powershell: dotnet restore EngineeringPerformance.slnx
        displayName: Restore solution

      - powershell: |
          $logPath = "$(Agent.TempDirectory)\eos-build.log"
          dotnet build EngineeringPerformance.slnx --configuration $(buildConfiguration) --no-restore 2>&1 |
            Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            # Re-emit compiler/MSBuild/NuGet errors through Azure logging commands so the actual
            # diagnostic text becomes a first-class pipeline/GitHub Check annotation.
            $diagnostics = Get-Content $logPath | Where-Object {
              $_ -match '\berror\s+(CS|MSB|NU|NETSDK)\d+' -or
              $_ -match ':\s+error\s+' -or
              $_ -match '\bBuild FAILED\b'
            } | Select-Object -Unique

            foreach ($line in $diagnostics) {
              $safe = $line.Replace("`r", ' ').Replace("`n", ' ')
              Write-Host "##vso[task.logissue type=error]$safe"
            }

            exit $exitCode
          }
        displayName: Build complete solution

      - powershell: |
          $results = "$(Agent.TempDirectory)\TestResults"
          New-Item -ItemType Directory -Force -Path $results | Out-Null

          dotnet test tests/EngineeringPerformance.Domain.Tests/EngineeringPerformance.Domain.Tests.csproj --configuration $(buildConfiguration) --no-build --no-restore --logger "trx;LogFileName=domain.trx" --results-directory $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/EngineeringPerformance.Infrastructure.Tests/EngineeringPerformance.Infrastructure.Tests.csproj --configuration $(buildConfiguration) --no-build --no-restore --logger "trx;LogFileName=infrastructure.trx" --results-directory $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/EngineeringPerformance.UI.Tests/EngineeringPerformance.UI.Tests.csproj --configuration $(buildConfiguration) --no-build --no-restore --logger "trx;LogFileName=ui.trx" --results-directory $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        displayName: Run tests

      - task: PublishTestResults@2
        displayName: Publish test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: '*.trx'
          searchFolder: '$(Agent.TempDirectory)\TestResults'
          mergeTestResults: true
          failTaskOnFailedTests: true
          testRunTitle: EOS Windows unit tests

      - powershell: ./scripts/capture-ui.ps1 -OutputDirectory "$(visualEvidenceDirectory)"
        displayName: Capture real WPF + WebView2 visual evidence

      - powershell: |
          $diagnostics = "$(diagnosticsDirectory)"
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
          $buildLog = "$(Agent.TempDirectory)\eos-build.log"
          if (Test-Path $buildLog) { Copy-Item $buildLog (Join-Path $diagnostics 'build.log') -Force }
          dotnet --info | Out-File (Join-Path $diagnostics 'dotnet-info.txt') -Encoding utf8
          git status --porcelain=v1 --branch | Out-File (Join-Path $diagnostics 'git-status.txt') -Encoding utf8
          @(
            "Build.SourceBranch=$(Build.SourceBranch)",
            "Build.SourceVersion=$(Build.SourceVersion)",
            "Agent.Name=$(Agent.Name)",
            "Agent.MachineName=$(Agent.MachineName)"
          ) | Out-File (Join-Path $diagnostics 'run-context.txt') -Encoding utf8
        displayName: Collect build diagnostics
        condition: always()

      - task: PublishPipelineArtifact@1
        displayName: Publish screenshots, browser diagnostics and app logs
        condition: always()
        inputs:
          targetPath: '$(visualEvidenceDirectory)'
          artifact: visual-evidence
          publishLocation: pipeline

      - task: PublishPipelineArtifact@1
        displayName: Publish build diagnostics
        condition: always()
        inputs:
          targetPath: '$(diagnosticsDirectory)'
          artifact: build-diagnostics
          publishLocation: pipeline
