# retrigger after EOS Azure VM restart 2026-08-23
trigger:
  batch: true
  branches:
    include:
      - ci/aps-vm-verify-12aadcd
  paths:
    exclude:
      - .ci-results/**

pr: none

variables:
  apsCommit: '12aadcd51c9d72f6a6b3c821555e00254a1a6225'
  apsSource: '$(Agent.TempDirectory)\ApsVmVerify\source'
  apsResults: '$(Agent.TempDirectory)\ApsVmVerify\test-results'
  apsPublish: '$(Agent.TempDirectory)\ApsVmVerify\desktop-publish'
  apsDiagnostics: '$(Agent.TempDirectory)\ApsVmVerify\diagnostics'
  apsLog: '$(Agent.TempDirectory)\ApsVmVerify\verify.log'

jobs:
  - job: aps_vm_verify
    displayName: APS 12aadcd on EOS Azure VM
    timeoutInMinutes: 60
    workspace:
      clean: all
    pool:
      name: Default
      demands:
        - Agent.Name -equals EOS

    steps:
      - checkout: self
        clean: true
        fetchDepth: 0
        persistCredentials: true

      - powershell: |
          $ErrorActionPreference = 'Stop'
          $resultRoot = Join-Path "$(Build.SourcesDirectory)" '.ci-results'
          New-Item -ItemType Directory -Force -Path $resultRoot | Out-Null
          $heartbeat = Join-Path $resultRoot 'aps-12aadcd-started.txt'
          @(
            'APS Azure VM verification started',
            'Requested commit: $(apsCommit)',
            'Agent: $(Agent.Name) / $(Agent.MachineName)',
            'Azure build: $(Build.BuildNumber)',
            'Azure branch: $(Build.SourceBranch)'
          ) | Set-Content -LiteralPath $heartbeat -Encoding utf8

          git config user.name 'EOS Azure VM verifier'
          git config user.email 'azure-vm-verifier@users.noreply.github.com'
          git add .ci-results/aps-12aadcd-started.txt
          git commit -m '[ci-heartbeat] APS 12aadcd verification started'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit Azure VM heartbeat.' }
          $branch = "$(Build.SourceBranch)" -replace '^refs/heads/', ''
          git push origin "HEAD:$branch"
          if ($LASTEXITCODE -ne 0) { throw 'Could not push Azure VM heartbeat back to GitHub.' }
        displayName: Report EOS Azure VM heartbeat to GitHub

      - task: UseDotNet@2
        displayName: Use .NET 10 SDK
        inputs:
          packageType: sdk
          version: 10.0.x

      - powershell: |
          $ErrorActionPreference = 'Stop'
          $root = Split-Path -Parent "$(apsSource)"
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          git clone --filter=blob:none --no-checkout https://github.com/bhadkamkar9snehil/APS.git "$(apsSource)"
          if ($LASTEXITCODE -ne 0) { throw "APS clone failed with exit code $LASTEXITCODE." }
          git -C "$(apsSource)" fetch origin "$(apsCommit)" --depth=1
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch APS commit $(apsCommit)." }
          git -C "$(apsSource)" checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Could not check out APS commit $(apsCommit)." }

          $resolved = (git -C "$(apsSource)" rev-parse HEAD).Trim()
          if ($resolved -ne "$(apsCommit)") { throw "Resolved APS commit $resolved does not match requested $(apsCommit)." }
          Write-Host "APS requested/resolved commit: $resolved"
          Write-Host "Azure agent: $(Agent.Name) / $(Agent.MachineName)"
        displayName: Resolve exact APS integration head

      - powershell: |
          $ErrorActionPreference = 'Continue'
          foreach ($path in @("$(apsResults)", "$(apsPublish)", "$(apsDiagnostics)")) {
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $path | Out-Null
          }
          $logParent = Split-Path -Parent "$(apsLog)"
          New-Item -ItemType Directory -Force -Path $logParent | Out-Null

          $exitCode = 0
          try {
            Push-Location "$(apsSource)"
            & ./build/verify.ps1 `
              -Configuration Release `
              -ResultsDirectory "$(apsResults)" `
              -PublishDirectory "$(apsPublish)" `
              -DiagnosticsDirectory "$(apsDiagnostics)" *>&1 |
              Tee-Object -FilePath "$(apsLog)"
            $exitCode = $LASTEXITCODE
            if ($null -eq $exitCode) { $exitCode = 0 }
          }
          catch {
            $_ | Out-String | Tee-Object -FilePath "$(apsLog)" -Append | Write-Host
            $exitCode = 1
          }
          finally {
            Pop-Location
          }

          $resultRoot = Join-Path "$(Build.SourcesDirectory)" '.ci-results'
          New-Item -ItemType Directory -Force -Path $resultRoot | Out-Null
          $resultPath = Join-Path $resultRoot 'aps-12aadcd.txt'

          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('APS Azure VM verification')
          $lines.Add('Requested commit: $(apsCommit)')
          $lines.Add("Resolved commit: $((git -C \"$(apsSource)\" rev-parse HEAD).Trim())")
          $lines.Add('Agent: $(Agent.Name) / $(Agent.MachineName)')
          $lines.Add('Azure build: $(Build.BuildNumber)')
          $lines.Add("Exit code: $exitCode")
          $lines.Add("Result: $(if ($exitCode -eq 0) { 'PASS' } else { 'FAIL' })")
          $lines.Add('')
          $lines.Add('Diagnostic matches:')

          if (Test-Path -LiteralPath "$(apsLog)") {
            $matches = Get-Content -LiteralPath "$(apsLog)" | Where-Object {
              $_ -match '\berror\s+(CS|MSB|NU|NETSDK)\d+' -or
              $_ -match ':\s+error\s+' -or
              $_ -match '\bFAILED\b' -or
              $_ -match '\bFailed!\b' -or
              $_ -match '\bException\b' -or
              $_ -match 'Test Run Failed' -or
              $_ -match 'Passed!' -or
              $_ -match 'Build succeeded' -or
              $_ -match 'Build FAILED'
            } | Select-Object -Unique
            foreach ($match in $matches) { $lines.Add([string]$match) }
            $lines.Add('')
            $lines.Add('Last 300 log lines:')
            foreach ($line in @(Get-Content -LiteralPath "$(apsLog)" -Tail 300)) { $lines.Add([string]$line) }
          }
          else {
            $lines.Add('Verification log was not created.')
          }

          $lines | Set-Content -LiteralPath $resultPath -Encoding utf8

          git add .ci-results/aps-12aadcd.txt
          git commit -m "[ci-result] APS 12aadcd verification: $(if ($exitCode -eq 0) { 'PASS' } else { 'FAIL' })"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit Azure VM verification result.' }
          $branch = "$(Build.SourceBranch)" -replace '^refs/heads/', ''
          git push origin "HEAD:$branch"
          if ($LASTEXITCODE -ne 0) { throw 'Could not push Azure VM verification result back to GitHub.' }

          if ($exitCode -ne 0) { exit $exitCode }
        displayName: Verify APS and write result back to GitHub
