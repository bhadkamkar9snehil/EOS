trigger:
  batch: true
  branches:
    include:
      - main

pr:
  autoCancel: true
  branches:
    include:
      - main

variables:
  buildConfiguration: Release

jobs:
  - job: windows_ci
    displayName: Windows build, test & visual QA
    timeoutInMinutes: 30
    pool:
      name: Default
      demands:
        - Agent.Name -equals EOS

    steps:
      - checkout: self
        clean: true
        persistCredentials: true

      - powershell: ./build/vm-health.ps1
        displayName: VM / agent preflight

      - task: UseDotNet@2
        displayName: Use .NET SDK from global.json
        inputs:
          packageType: sdk
          useGlobalJson: true
          workingDirectory: $(Build.SourcesDirectory)

      - powershell: dotnet restore EngineeringPerformance.slnx
        displayName: Restore solution

      - powershell: dotnet build EngineeringPerformance.slnx --configuration $(buildConfiguration) --no-restore
        displayName: Build complete solution

      - powershell: |
          dotnet test tests/EngineeringPerformance.Domain.Tests/EngineeringPerformance.Domain.Tests.csproj --configuration $(buildConfiguration) --no-build --no-restore --logger "trx;LogFileName=domain.trx" --results-directory "$(Agent.TempDirectory)\TestResults"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/EngineeringPerformance.Infrastructure.Tests/EngineeringPerformance.Infrastructure.Tests.csproj --configuration $(buildConfiguration) --no-build --no-restore --logger "trx;LogFileName=infrastructure.trx" --results-directory "$(Agent.TempDirectory)\TestResults"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/EngineeringPerformance.UI.Tests/EngineeringPerformance.UI.Tests.csproj --configuration $(buildConfiguration) --no-build --no-restore --logger "trx;LogFileName=ui.trx" --results-directory "$(Agent.TempDirectory)\TestResults"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        displayName: Run tests

      - task: PublishTestResults@2
        displayName: Publish test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: '*.trx'
          searchFolder: '$(Agent.TempDirectory)\TestResults'
          mergeTestResults: true
          failTaskOnFailedTests: true
          testRunTitle: EOS Windows unit tests

      # Runs the actual WPF + BlazorWebView host against synthetic July fixtures, captures the
      # rendered WebView2 surface, records DOM overflow diagnostics, and copies the app's Serilog
      # output. Keep this non-blocking while the capture channel is being hardened; the core build
      # and tests remain authoritative if a Windows session/WebView2 infrastructure quirk occurs.
      - powershell: ./scripts/visual-qa.ps1 -OutputDirectory "$(Build.ArtifactStagingDirectory)\visual-qa"
        displayName: Capture real EOS screens
        continueOnError: true

      - powershell: New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)\visual-qa" | Out-Null
        displayName: Ensure visual QA artifact directory
        condition: always()

      - task: PublishPipelineArtifact@1
        displayName: Publish visual QA screenshots and logs
        condition: always()
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)\visual-qa'
          artifactName: visual-qa

      # The Azure artifact remains the canonical build evidence. This generated branch mirrors only
      # the latest synthetic-data screenshots/logs so automated reviewers can inspect the PNGs
      # directly through GitHub without requiring an interactive Azure DevOps browser session.
      - powershell: ./scripts/publish-visual-qa-branch.ps1 -OutputDirectory "$(Build.ArtifactStagingDirectory)\visual-qa"
        displayName: Mirror latest visual QA evidence to GitHub
        condition: always()
        continueOnError: true
