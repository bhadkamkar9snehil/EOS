trigger:
  batch: true
  branches:
    include:
      - main

pr:
  autoCancel: true
  branches:
    include:
      - main

variables:
  buildConfiguration: Release

jobs:
  - job: windows_ci
    displayName: Windows build & test
    timeoutInMinutes: 30
    pool:
      name: Default
      demands:
        - Agent.Name -equals EOS

    steps:
      - checkout: self
        clean: true
        persistCredentials: true

      - powershell: ./build/vm-health.ps1
        displayName: VM / agent preflight

      - task: UseDotNet@2
        displayName: Use .NET SDK from global.json
        inputs:
          packageType: sdk
          useGlobalJson: true
          workingDirectory: $(Build.SourcesDirectory)

      - powershell: dotnet restore EngineeringPerformance.slnx
        displayName: Restore solution

      - powershell: |
          $logPath = "$(Agent.TempDirectory)\eos-build.log"
          dotnet build EngineeringPerformance.slnx --configuration $(buildConfiguration) --no-restore 2>&1 |
            Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { exit $exitCode }
        displayName: Build complete solution

      # Azure Pipelines' GitHub Check only reports the final PowerShell exit code. Preserve the
      # actual compiler output somewhere this repo's automation can inspect without requiring a
      # person to open Azure DevOps. ci-evidence is excluded from CI triggers, so this push cannot
      # recurse into another build.
      - powershell: |
          $ErrorActionPreference = 'Stop'
          $sourceLog = "$(Agent.TempDirectory)\eos-build.log"
          if (-not (Test-Path $sourceLog)) { exit 0 }

          $worktree = Join-Path "$(Agent.TempDirectory)" "eos-ci-evidence-$(Build.BuildId)"
          if (Test-Path $worktree) { Remove-Item $worktree -Recurse -Force }

          git fetch origin ci-evidence
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch ci-evidence branch." }
          git worktree add --detach $worktree origin/ci-evidence
          if ($LASTEXITCODE -ne 0) { throw "Could not create ci-evidence worktree." }

          try {
            $targetDirectory = Join-Path $worktree 'ci'
            New-Item -ItemType Directory -Force -Path $targetDirectory | Out-Null
            $target = Join-Path $targetDirectory 'latest-build.log'
            @(
              "Build: $(Build.BuildNumber)",
              "BuildId: $(Build.BuildId)",
              "Commit: $(Build.SourceVersion)",
              "Branch: $(Build.SourceBranch)",
              "CapturedUtc: $([DateTime]::UtcNow.ToString('O'))",
              "",
              (Get-Content $sourceLog -Raw)
            ) | Set-Content -Path $target -Encoding utf8

            git -C $worktree config user.name 'EOS Azure CI'
            git -C $worktree config user.email 'ci@eos.local'
            git -C $worktree add ci/latest-build.log
            git -C $worktree commit -m "Capture failed build $(Build.BuildNumber)"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit CI evidence." }
            git -C $worktree push origin HEAD:ci-evidence
            if ($LASTEXITCODE -ne 0) { throw "Could not push CI evidence." }
          }
          finally {
            git worktree remove --force $worktree 2>$null
          }
        displayName: Mirror failed build log to GitHub
        condition: failed()
        continueOnError: true

      - powershell: |
          dotnet test tests/EngineeringPerformance.Domain.Tests/EngineeringPerformance.Domain.Tests.csproj --configuration $(buildConfiguration) --no-build --no-restore --logger "trx;LogFileName=domain.trx" --results-directory "$(Agent.TempDirectory)\TestResults"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/EngineeringPerformance.Infrastructure.Tests/EngineeringPerformance.Infrastructure.Tests.csproj --configuration $(buildConfiguration) --no-build --no-restore --logger "trx;LogFileName=infrastructure.trx" --results-directory "$(Agent.TempDirectory)\TestResults"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/EngineeringPerformance.UI.Tests/EngineeringPerformance.UI.Tests.csproj --configuration $(buildConfiguration) --no-build --no-restore --logger "trx;LogFileName=ui.trx" --results-directory "$(Agent.TempDirectory)\TestResults"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        displayName: Run tests

      - task: PublishTestResults@2
        displayName: Publish test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: '*.trx'
          searchFolder: '$(Agent.TempDirectory)\TestResults'
          mergeTestResults: true
          failTaskOnFailedTests: true
          testRunTitle: EOS Windows unit tests
