trigger:
  batch: true
  branches:
    include:
      - ci/acm-vm-verify-5555c13-v2
  paths:
    exclude:
      - .ci-results/**

pr: none

jobs:
  - job: acm_verify
    displayName: ACM main aa55d12 Windows verification
    timeoutInMinutes: 60
    pool:
      name: Default
      demands:
        - Agent.Name -equals EOS
    workspace:
      clean: all

    steps:
      - checkout: self
        clean: true
        fetchDepth: 0
        persistCredentials: true

      - powershell: |
          $ErrorActionPreference = 'Stop'
          $commit = 'aa55d12a1ea62c23852c01e0be38628ea82fbd1c'
          $eos = '$(Build.SourcesDirectory)'
          $work = Join-Path '$(Agent.TempDirectory)' 'AcmVerifyMainAa55d12'
          $source = Join-Path $work 'source'
          $uvRoot = Join-Path $work 'uv'
          $pythonRoot = Join-Path $work 'python'
          $cache = Join-Path $work 'cache'
          $progress = Join-Path $eos '.ci-results\acm-main-aa55d12.txt'
          $fastLog = Join-Path $work 'fast.log'
          $statLog = Join-Path $work 'statistical.log'

          git -C $eos config user.name 'EOS Azure VM verifier'
          git -C $eos config user.email 'azure-vm-verifier@users.noreply.github.com'

          function Report([string]$line) {
            $stamp = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            New-Item -ItemType Directory -Force -Path (Split-Path $progress -Parent) | Out-Null
            Add-Content -LiteralPath $progress -Value "$stamp  $line" -Encoding utf8
            git -C $eos add .ci-results/acm-main-aa55d12.txt
            git -C $eos commit -m "[ci-progress] ACM main aa55d12: $line" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not commit progress.' }
            $branch = '$(Build.SourceBranch)' -replace '^refs/heads/', ''
            git -C $eos push origin "HEAD:$branch" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not push progress.' }
          }

          function Publish-LogTail([string]$logPath, [int]$lines) {
            if (Test-Path $logPath) {
              Get-Content $logPath -Tail $lines | Add-Content $progress
              git -C $eos add .ci-results/acm-main-aa55d12.txt
              git -C $eos commit -m '[ci-result] ACM main aa55d12 failure detail' | Out-Null
              $branch = '$(Build.SourceBranch)' -replace '^refs/heads/', ''
              git -C $eos push origin "HEAD:$branch" | Out-Null
            }
          }

          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $uvRoot | Out-Null
          if (Test-Path $progress) { Remove-Item $progress -Force }
          Report "START exact ACM main $commit"

          git clone --filter=blob:none --no-checkout https://github.com/bhadkamkar9snehil/ACM.git $source
          if ($LASTEXITCODE -ne 0) { Report 'CHECKOUT FAIL clone'; exit 1 }
          git -C $source fetch origin $commit --depth=1
          if ($LASTEXITCODE -ne 0) { Report 'CHECKOUT FAIL fetch'; exit 1 }
          git -C $source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { Report 'CHECKOUT FAIL checkout'; exit 1 }
          $resolved = (git -C $source rev-parse HEAD).Trim()
          if ($resolved -ne $commit) { Report "CHECKOUT FAIL resolved=$resolved"; exit 1 }
          Report "CHECKOUT PASS $resolved"

          $zip = Join-Path $uvRoot 'uv.zip'
          $curl = Get-Command curl.exe -ErrorAction SilentlyContinue
          if (-not $curl) { Report 'UV FAIL curl.exe unavailable'; exit 1 }
          & $curl.Source -L --fail --silent --show-error https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip -o $zip
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $zip)) { Report "UV DOWNLOAD FAIL exit=$LASTEXITCODE"; exit 1 }
          Expand-Archive -LiteralPath $zip -DestinationPath $uvRoot -Force
          $uv = (Get-ChildItem $uvRoot -Filter uv.exe -Recurse | Select-Object -First 1).FullName
          if (-not $uv) { Report 'UV FAIL executable missing'; exit 1 }
          Report "UV READY $(& $uv --version)"

          $env:UV_PYTHON_INSTALL_DIR = $pythonRoot
          $env:UV_CACHE_DIR = $cache
          $env:OMP_NUM_THREADS = '1'
          $env:OPENBLAS_NUM_THREADS = '1'
          $env:MKL_NUM_THREADS = '1'
          $env:NUMEXPR_NUM_THREADS = '1'

          Push-Location $source
          try {
            Report 'PYTHON 3.12 INSTALL START'
            & $uv python install 3.12
            if ($LASTEXITCODE -ne 0) { Report "PYTHON INSTALL FAIL exit=$LASTEXITCODE"; exit 1 }
            Report 'PYTHON 3.12 INSTALL PASS'

            Report 'SYNC START locked'
            & $uv sync --locked --python 3.12
            if ($LASTEXITCODE -ne 0) { Report "SYNC FAIL exit=$LASTEXITCODE"; exit 1 }
            Report 'SYNC PASS'

            Report 'FAST START'
            & $uv run --python 3.12 pytest tests -m 'not statistical' --tb=short -q *>&1 | Tee-Object -FilePath $fastLog
            $fastCode = $LASTEXITCODE
            if ($fastCode -ne 0) {
              Report "FAST FAIL exit=$fastCode"
              Publish-LogTail $fastLog 180
              exit $fastCode
            }
            Report 'FAST PASS'

            Report 'STATISTICAL START'
            & $uv run --python 3.12 pytest tests -m statistical --tb=short -q *>&1 | Tee-Object -FilePath $statLog
            $statCode = $LASTEXITCODE
            if ($statCode -ne 0) {
              Report "STATISTICAL FAIL exit=$statCode"
              Publish-LogTail $statLog 240
              exit $statCode
            }
            Report 'STATISTICAL PASS'
            Report 'FINAL PASS fast=PASS statistical=PASS'
          }
          finally {
            Pop-Location
          }
        displayName: Bootstrap Python and run ACM main fast + statistical suites
