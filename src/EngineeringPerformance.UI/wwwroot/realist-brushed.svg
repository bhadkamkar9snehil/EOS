<svg xmlns="http://www.w3.org/2000/svg" width="260" height="180" viewBox="0 0 260 180">
  <filter id="brush" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.015 0.72" numOctaves="2" seed="23" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono" result="soft">
      <feFuncA type="table" tableValues="0 0.085"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" in2="soft" mode="multiply"/>
  </filter>
  <rect width="260" height="180" fill="#efe4d2" filter="url(#brush)"/>
</svg>
