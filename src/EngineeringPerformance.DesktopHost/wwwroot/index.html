<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engineering Performance</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/EngineeringPerformance.UI/app.css?v=14" />
    <link rel="stylesheet" href="_content/EngineeringPerformance.UI/employees.css?v=4" />
    <link rel="stylesheet" href="_content/EngineeringPerformance.UI/scoring-data.css?v=2" />
    <link rel="stylesheet" href="_content/EngineeringPerformance.UI/analytics-extension.css?v=6" />
    <link rel="stylesheet" href="_content/EngineeringPerformance.UI/theme-contract.css?v=2" />
    <link rel="stylesheet" href="_content/EngineeringPerformance.UI/theme-library.css?v=5" />
    <link rel="stylesheet" href="_content/EngineeringPerformance.UI/atlas.css?v=16" />
    <link rel="stylesheet" href="_content/EngineeringPerformance.UI/atlas-workbenches.css?v=1" />
    <link rel="stylesheet" href="_content/EngineeringPerformance.UI/atlas-imports.css?v=1" />
    <link rel="stylesheet" href="_content/EngineeringPerformance.UI/atlas-polish.css?v=18" />
    <!-- theme.js runs blocking, before first paint, to avoid a flash of the wrong theme. -->
    <script src="_content/EngineeringPerformance.UI/theme.js?v=11"></script>
    <!-- Everything below is not needed for first paint, so it's deferred to let Blazor boot sooner. -->
    <script src="_content/EngineeringPerformance.UI/theme-audit.js?v=2" defer></script>
    <!-- echarts.min.js (1.1MB) is lazy-loaded via echarts-loader.js only on chart-rendering routes.
         Confirmed atlas-charts.js's rewritten chart set (visual-lab) only touches the `echarts`
         global lazily inside draw functions, never at parse time, so this still holds. -->
    <script src="_content/EngineeringPerformance.UI/echarts-loader.js?v=1" defer></script>
    <script src="_content/EngineeringPerformance.UI/charts.js?v=6" defer></script>
    <script src="_content/EngineeringPerformance.UI/analytics-charts.js?v=4" defer></script>
    <script src="_content/EngineeringPerformance.UI/atlas-charts.js?v=25" defer></script>
</head>
<body>
    <div id="app">
        <div class="startup-stage" role="status" aria-live="polite">
            <strong>EOS</strong>
            <span>Starting Engineering Performance Analyzer…</span>
        </div>
    </div>
    <div id="blazor-error-ui" style="display:none">An unexpected error occurred.</div>
    <!-- defer keeps this after the deferred head scripts above, in document order, so chart/theme
         globals they define exist before Blazor components can call into them via JS interop. -->
    <script src="_framework/blazor.webview.js" defer></script>
</body>
</html>
