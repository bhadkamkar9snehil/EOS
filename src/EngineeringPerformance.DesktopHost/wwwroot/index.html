<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engineering Performance</title>
    <base href="/" />
    <!-- Synchronous and ordered before the stylesheet so the [data-theme] attribute (if the user
         picked light/dark explicitly) is set before tailwind.css's dark palette rules are even
         parsed, avoiding a flash of the wrong theme on launch. -->
    <script>(function(){try{var m=localStorage.getItem('epa-theme');if(m==='light'||m==='dark')document.documentElement.dataset.theme=m;}catch(e){}})();</script>
    <link rel="stylesheet" href="_content/EngineeringPerformance.UI/tailwind.css?v=2" />
    <!-- echarts.min.js (1.1MB) is lazy-loaded via echarts-loader.js only on chart-rendering routes.
         Confirmed atlas-charts.js's chart set only touches the `echarts` global lazily inside draw
         functions, never at parse time, so this still holds. -->
    <script src="_content/EngineeringPerformance.UI/theme.js?v=1" defer></script>
    <script src="_content/EngineeringPerformance.UI/echarts-loader.js?v=1" defer></script>
    <script src="_content/EngineeringPerformance.UI/charts.js?v=6" defer></script>
    <script src="_content/EngineeringPerformance.UI/analytics-charts.js?v=4" defer></script>
    <script src="_content/EngineeringPerformance.UI/atlas-charts.js?v=25" defer></script>
</head>
<body class="bg-canvas font-sans text-ink">
    <div id="app">
        <div class="flex h-screen w-screen flex-col items-center justify-center gap-2 bg-canvas" role="status" aria-live="polite">
            <strong class="text-2xl font-bold text-primary">EOS</strong>
            <span class="text-sm text-ink-soft">Starting Engineering Performance Analyzer…</span>
        </div>
    </div>
    <div id="blazor-error-ui" class="hidden fixed inset-x-0 bottom-0 z-50 border-t border-critical-soft bg-critical-soft p-3 text-sm text-critical">An unexpected error occurred.</div>
    <!-- defer keeps this after the deferred head scripts above, in document order, so chart
         globals they define exist before Blazor components can call into them via JS interop. -->
    <script src="_framework/blazor.webview.js" defer></script>
</body>
</html>
