trigger: none
pr: none

parameters:
  - name: repository
    displayName: Repository to build
    type: string
    default: EOS
    values:
      - EOS
      - APS

  - name: ref
    displayName: Branch, tag, full ref, or commit SHA
    type: string
    default: main

  - name: configuration
    displayName: Build configuration
    type: string
    default: Release
    values:
      - Debug
      - Release

  - name: runVisualValidation
    displayName: Run EOS WPF/WebView2 visual validation
    type: boolean
    default: false

variables:
  targetSourceRoot: '$(Agent.TempDirectory)\WindowsBuildLab\source'
  testResultsDirectory: '$(Agent.TempDirectory)\WindowsBuildLab\test-results'
  artifactDirectory: '$(Agent.TempDirectory)\WindowsBuildLab\artifacts'
  fallbackDotNetSdk: '10.0.203'

jobs:
  - job: windows_build_lab
    displayName: Windows Build Lab · ${{ parameters.repository }} · ${{ parameters.ref }}
    timeoutInMinutes: 45
    workspace:
      clean: all
    pool:
      name: Default
      demands:
        - Agent.Name -equals EOS

    steps:
      - checkout: self
        clean: true
        fetchDepth: 1
        persistCredentials: false

      - powershell: |
          $ErrorActionPreference = 'Stop'
          $target = "$(targetSourceRoot)"
          $parent = Split-Path -Parent $target
          if (Test-Path $parent) { Remove-Item $parent -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $parent | Out-Null

          $repository = '${{ parameters.repository }}'
          $ref = '${{ parameters.ref }}'.Trim()
          if ([string]::IsNullOrWhiteSpace($ref)) { throw 'A branch, tag, ref, or commit SHA is required.' }

          $url = switch ($repository) {
            'EOS' { 'https://github.com/bhadkamkar9snehil/EOS.git' }
            'APS' { 'https://github.com/bhadkamkar9snehil/APS.git' }
            default { throw "Unsupported repository '$repository'." }
          }

          git clone --filter=blob:none --no-checkout $url $target
          if ($LASTEXITCODE -ne 0) { throw "git clone failed with exit code $LASTEXITCODE." }

          if ($ref -match '^refs/' -or $ref -match '^[0-9a-fA-F]{7,40}$') {
            git -C $target fetch origin $ref --depth=1
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch '$ref' from $url." }
          }
          else {
            git -C $target fetch origin "refs/heads/$ref" --depth=1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "No branch named '$ref'; trying tag."
              git -C $target fetch origin "refs/tags/$ref" --depth=1
              if ($LASTEXITCODE -ne 0) { throw "Could not resolve '$ref' as a branch, tag or commit in $url." }
            }
          }

          git -C $target checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Could not check out '$ref'." }

          $globalJson = Join-Path $target 'global.json'
          $hasGlobalJson = Test-Path -LiteralPath $globalJson
          Write-Host "##vso[task.setvariable variable=TargetHasGlobalJson]$($hasGlobalJson.ToString().ToLowerInvariant())"

          Write-Host "Repository: $repository"
          Write-Host "Requested ref: $ref"
          Write-Host "Resolved commit: $(git -C $target rev-parse HEAD)"
          Write-Host "Target global.json: $hasGlobalJson"
        displayName: Resolve requested repository ref

      - task: UseDotNet@2
        displayName: Use target ref SDK from global.json
        condition: and(succeeded(), eq(variables['TargetHasGlobalJson'], 'true'))
        inputs:
          packageType: sdk
          useGlobalJson: true
          workingDirectory: $(targetSourceRoot)

      - task: UseDotNet@2
        displayName: Use fallback .NET SDK for legacy refs
        condition: and(succeeded(), ne(variables['TargetHasGlobalJson'], 'true'))
        inputs:
          packageType: sdk
          version: $(fallbackDotNetSdk)

      - powershell: |
          $runVisual = '${{ parameters.runVisualValidation }}' -eq 'True'
          $arguments = @(
            '-Repository', '${{ parameters.repository }}',
            '-SourceRoot', '$(targetSourceRoot)',
            '-Configuration', '${{ parameters.configuration }}',
            '-ResultsDirectory', '$(testResultsDirectory)',
            '-ArtifactDirectory', '$(artifactDirectory)'
          )
          if ($runVisual) { $arguments += '-RunVisualValidation' }
          & ./scripts/invoke-generic-windows-build.ps1 @arguments
        displayName: Build, test and validate requested ref

      - task: PublishTestResults@2
        displayName: Publish test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: '*.trx'
          searchFolder: '$(testResultsDirectory)'
          mergeTestResults: true
          failTaskOnFailedTests: true
          testRunTitle: 'Windows Build Lab · ${{ parameters.repository }} · ${{ parameters.ref }}'

      - task: PublishPipelineArtifact@1
        displayName: Publish verification artifacts
        condition: always()
        inputs:
          targetPath: '$(artifactDirectory)'
          artifact: windows-build-lab
          publishLocation: pipeline
